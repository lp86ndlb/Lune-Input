name: Publish Lune v0.1.0
on:
  push:
    branches: [main]
    paths: [.github/workflows/lune-release.yml]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > /tmp/lune-release-notes.md <<'NOTES'
          Lune Input 首个版本，基于 Fcitx5 和 Rime，为 Ubuntu 桌面提供中文输入方案。

          - 朙月拼音、横排九候选和 Catppuccin Mocha 圆角主题。
          - 英文候选、中英混输、长词补全和可手动更新的 IT 词库。
          - 匹配的 Ubuntu 24.04 X11 环境可选用右边框宽度过渡。
          - 提供当前用户安装脚本、配置备份和源码构建脚本。

          安装与兼容性说明见仓库 README。
          NOTES
          gh release view v0.1.0 >/dev/null 2>&1 || gh release create v0.1.0 --title 'Lune Input v0.1.0' --notes-file /tmp/lune-release-notes.md --verify-tag
